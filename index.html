<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open YouTube</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
    }
    .card {
      text-align: center;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.10);
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 24px;
      background: #ff0033;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #d9002b; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome</h1>
    <p>Click the button below to open YouTube.</p>
    <button type="button" onclick="window.location.href='https://www.youtube.com/'">
      Open YouTube
    </button>
  </main>
</body>
</html>
